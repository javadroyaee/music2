name: Build JRweb Music Player APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore app/jrweb-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias jrwebkey \
            -storepass jrweb123456 -keypass jrweb123456 \
            -dname "CN=JRweb, OU=Dev, O=JRweb, L=Tehran, ST=Tehran, C=IR"

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: JRweb-Music-Player-APK
          path: app/build/outputs/apk/release/app-release.apk
